on:
  push:
    branches:
      - main

permissions:
  contents: read

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # PAT (not GITHUB_TOKEN): the built-in token cannot create PRs from
          # Actions-triggered pushes (loop protection), which is exactly what
          # release-please does. Classic PAT with repo scope works.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          release-type: node
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
